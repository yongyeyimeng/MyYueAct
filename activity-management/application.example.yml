# 复制本文件为 src/main/resources/application.yml 后填写你的真实配置。
# 也可以直接设置环境变量 DB_PASSWORD / WECHAT_APPID / WECHAT_SECRET / JWT_SECRET。

spring:
  application:
    name: activity-management
  datasource:
    url: jdbc:mysql://localhost:3306/huoji
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${DB_PASSWORD}

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true

wechat:
  appid: ${WECHAT_APPID}
  secret: ${WECHAT_SECRET}

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    yimeng: INFO
    org.mybatis: WARN
    org.springframework.web: INFO
